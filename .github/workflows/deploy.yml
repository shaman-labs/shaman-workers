name: Build, Push and Deploy to Digital Ocean

on:
  push:
    branches:
      - main

env:
  REGISTRY: "registry.digitalocean.com/shaman"
  IMAGE_NAME: "shaman-image"

jobs:
  build-push-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set $TAG from shortened sha
        run: echo "TAG=`echo ${GITHUB_SHA} | cut -c1-8`" >> $GITHUB_ENV

      - name: Log in to Digital Ocean Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6.5.0
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Update app.yaml with environment variables
        run: |
          export TAG=${{ env.TAG }}
          export IPFS_GATEWAY=${{ secrets.IPFS_GATEWAY }}
          export ARB_SEPOLIA_RPC_URL=${{ secrets.ARB_SEPOLIA_RPC_URL }}
          export PRIVY_APP_ID=${{ secrets.PRIVY_APP_ID }}
          export PRIVY_APP_SECRET=${{ secrets.PRIVY_APP_SECRET }}
          export PRIVY_AUTH_PRIVATE_KEY=${{ secrets.PRIVY_AUTH_PRIVATE_KEY }}
          export OPERATOR_PRIVATE_KEY=${{ secrets.OPERATOR_PRIVATE_KEY }}
          export WORLD_ADDRESS=${{ secrets.WORLD_ADDRESS }}
          export S3_KEY=${{ secrets.S3_KEY }}
          export S3_SECRET=${{ secrets.S3_SECRET }}
          export S3_BUCKET=${{ secrets.S3_BUCKET }}
          envsubst < .do/app.yaml > .do/app.yaml.tmp
          mv .do/app.yaml.tmp .do/app.yaml
          cat .do/app.yaml

      - name: Deploy the app
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
