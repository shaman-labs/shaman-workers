version: "3"

services:
  app:
    build: .
    container_name: shaman-container
    image: shaman-image
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
