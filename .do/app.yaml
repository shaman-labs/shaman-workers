name: shaman-app
region: nyc
services:
  - name: shaman-service
    github:
      branch: main
      deploy_on_push: false
    http_port: 8000
    image:
      registry: registry.digitalocean.com/shaman
      repository: shaman-image
      tag: ${TAG}
      registry_type: DOCR
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: IPFS_GATEWAY
        scope: RUN_TIME
        value: ${IPFS_GATEWAY}
      - key: ARB_SEPOLIA_RPC_URL
        scope: RUN_TIME
        value: ${ARB_SEPOLIA_RPC_URL}
      - key: PRIVY_APP_ID
        scope: RUN_TIME
        value: ${PRIVY_APP_ID}
      - key: PRIVY_APP_SECRET
        scope: RUN_TIME
        value: ${PRIVY_APP_SECRET}
      - key: PRIVY_AUTH_PRIVATE_KEY
        scope: RUN_TIME
        value: ${PRIVY_AUTH_PRIVATE_KEY}
      - key: OPERATOR_PRIVATE_KEY
        scope: RUN_TIME
        value: ${OPERATOR_PRIVATE_KEY}
      - key: WORLD_ADDRESS
        scope: RUN_TIME
        value: ${WORLD_ADDRESS}
      - key: S3_KEY
        scope: RUN_TIME
        value: ${S3_KEY}
      - key: S3_SECRET
        scope: RUN_TIME
        value: ${S3_SECRET}
      - key: S3_BUCKET
        scope: RUN_TIME
        value: ${S3_BUCKET}
